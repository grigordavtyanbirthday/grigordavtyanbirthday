<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700;6..96,900&family=Montserrat:wght@300;400;500;600;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "Montserrat", sans-serif;
    background: #f3f1ed;
    color: #111;
}


/* ==========================================================
   COMPLETE BACKGROUND SCENE
========================================================== */

.scene {

    position: relative;

    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 65px 20px;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 48% 25%,
            rgba(255,255,255,.98),
            rgba(250,249,246,.98) 46%,
            rgba(239,237,232,.98) 100%
        );

}


/* very soft paper/table texture */

.scene::before {

    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: .3;

    background-image:

        radial-gradient(
            rgba(80,70,60,.07) .4px,
            transparent .7px
        );

    background-size: 6px 6px;

}



/* ==========================================================
   KRAFT ENVELOPE
========================================================== */

.envelope {

    position: absolute;

    z-index: 1;

    width: 625px;
    height: 930px;

    left: 50%;
    top: 50%;

    transform:
        translate(-46%, -48%)
        rotate(-4deg);

    border-radius: 2px;

    background:

        repeating-linear-gradient(
            8deg,
            rgba(80,55,30,.025) 0px,
            rgba(80,55,30,.025) 1px,
            transparent 1px,
            transparent 5px
        ),

        repeating-linear-gradient(
            93deg,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            transparent 1px,
            transparent 7px
        ),

        #b58a5e;

    box-shadow:

        0 25px 55px rgba(71,48,30,.25);

}


/* top flap */

.envelope::before {

    content: "";

    position: absolute;

    width: 100%;
    height: 50%;

    top: 0;
    left: 0;

    clip-path: polygon(
        0 0,
        100% 0,
        50% 60%
    );

    background:
        linear-gradient(
            170deg,
            rgba(255,255,255,.06),
            rgba(95,62,34,.10)
        );

}


/* lower envelope folds */

.envelope::after {

    content: "";

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            35deg,
            transparent 49.5%,
            rgba(79,51,29,.12) 50%,
            transparent 50.8%
        ),

        linear-gradient(
            -35deg,
            transparent 49.5%,
            rgba(79,51,29,.12) 50%,
            transparent 50.8%
        );

}



/* ==========================================================
   PLANT DECORATIONS
========================================================== */

.plant {

    position: absolute;

    z-index: 2;

    width: 180px;
    height: 400px;

    pointer-events: none;

}


.plant-left {

    left: calc(50% - 440px);
    bottom: -100px;

    transform: rotate(-18deg);

}


.plant-right {

    right: calc(50% - 450px);
    top: -130px;

    transform:
        rotate(160deg)
        scale(.75);

}


/* main stem */

.plant::before {

    content: "";

    position: absolute;

    width: 3px;
    height: 100%;

    left: 50%;

    background:

        linear-gradient(
            #667054,
            #82876d
        );

    border-radius: 100%;

    transform: rotate(5deg);

}


/* leaves */

.leaf {

    position: absolute;

    width: 24px;
    height: 63px;

    border-radius:
        100% 0 100% 0;

    background:

        linear-gradient(
            135deg,
            #526044,
            #889077
        );

    opacity: .88;

}


.l1 { top:35px; left:61px; transform:rotate(-40deg); }
.l2 { top:75px; left:100px; transform:rotate(38deg); }
.l3 { top:120px; left:59px; transform:rotate(-43deg); }
.l4 { top:165px; left:101px; transform:rotate(37deg); }
.l5 { top:210px; left:61px; transform:rotate(-45deg); }
.l6 { top:255px; left:99px; transform:rotate(38deg); }
.l7 { top:300px; left:64px; transform:rotate(-40deg); }


.flower {

    position: absolute;

    width: 16px;
    height: 45px;

    background:

        linear-gradient(
            #745865,
            #aa7885
        );

    border-radius:
        70% 70% 45% 45%;

}


.fl1 { top:20px; left:100px; transform:rotate(22deg); }
.fl2 { top:125px; left:48px; transform:rotate(-30deg); }
.fl3 { top:225px; left:110px; transform:rotate(34deg); }



/* ==========================================================
   INVITATION CARD
========================================================== */

.card {

    position: relative;

    z-index: 5;

    width: 545px;

    background: #fbfaf7;

    overflow: hidden;

    box-shadow:

        0 24px 60px rgba(48,35,26,.20),
        0 5px 16px rgba(48,35,26,.10);

}



/* ==========================================================
   PHOTO
========================================================== */

.photo {

    position: relative;

    width: 100%;
    height: 505px;

    overflow: hidden;

    background: #c7c7c7;

}


.photo img {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    /*
       ADJUST THIS ONLY IF YOUR FACE
       NEEDS TO MOVE UP/DOWN
    */

    object-position: center 24%;

    filter:

        grayscale(100%)
        contrast(1.08)
        brightness(.92);

}


/* cinematic grey wash */

.photo::after {

    content: "";

    position: absolute;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:

        linear-gradient(
            to bottom,
            rgba(220,220,220,.06),
            rgba(45,45,45,.08)
        );

}



/* ==========================================================
   HUGE TRANSPARENT 33
========================================================== */

.age {

    position: absolute;

    z-index: 3;

    top: -35px;

    left: 50%;

    transform: translateX(-50%);

    width: 116%;

    text-align: center;

    font-family: "Bodoni Moda", serif;

    font-weight: 400;

    font-size: 385px;

    line-height: .95;

    letter-spacing: -58px;

    padding-right: 58px;

    color: rgba(235,235,235,.35);

    user-select: none;
    pointer-events: none;

}



/* ==========================================================
   PAPER AREA
========================================================== */

.paper {

    position: relative;

    z-index: 8;

    margin-top: -66px;

    min-height: 590px;

    padding:

        123px
        49px
        48px;

    background: #faf9f6;

}


/* paper grain */

.paper::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: .38;

    background-image:

        repeating-linear-gradient(
            6deg,
            rgba(90,75,60,.026) 0px,
            rgba(90,75,60,.026) 1px,
            transparent 1px,
            transparent 5px
        ),

        repeating-linear-gradient(
            92deg,
            rgba(90,75,60,.018) 0px,
            rgba(90,75,60,.018) 1px,
            transparent 1px,
            transparent 8px
        ),

        radial-gradient(
            rgba(60,50,40,.035) .5px,
            transparent .7px
        );

    background-size:
        auto,
        auto,
        5px 5px;

}



/* ==========================================================
   REAL TORN EDGE

   SVG + TURBULENCE = irregular paper tear
========================================================== */

.torn-edge {

    position: absolute;

    z-index: 10;

    width: 104%;

    height: 108px;

    top: -76px;
    left: -2%;

    overflow: visible;

    filter:
        drop-shadow(
            0 -4px 4px rgba(0,0,0,.11)
        );

}


.torn-edge rect {

    fill: #faf9f6;

}



/* fuzzy paper hairs */

.paper-hairs {

    position: absolute;

    z-index: 11;

    top: -51px;
    left: -1%;

    width: 102%;
    height: 55px;

    opacity: .22;

    pointer-events: none;

    background:

        repeating-linear-gradient(
            98deg,

            transparent 0px,
            transparent 7px,

            rgba(105,100,90,.35) 8px,

            transparent 9px,
            transparent 14px
        );

    mask-image:

        linear-gradient(
            to bottom,

            transparent 0%,
            black 35%,
            black 55%,
            transparent 100%
        );

}



/* ==========================================================
   RANDOM GOLD LEAF
========================================================== */

.gold {

    position: absolute;

    z-index: 15;

    background:

        linear-gradient(
            135deg,
            #8f6504,
            #eccb54,
            #a67a0d
        );

    clip-path:

        polygon(
            0 35%,
            38% 0,
            100% 25%,
            70% 100%,
            17% 76%
        );

}


.g1 {
    width: 7px;
    height: 4px;
    right: 24px;
    top: 65px;
    transform: rotate(30deg);
}

.g2 {
    width: 6px;
    height: 5px;
    right: 44px;
    top: 90px;
    transform: rotate(-23deg);
}

.g3 {
    width: 4px;
    height: 7px;
    right: 18px;
    top: 118px;
    transform: rotate(58deg);
}

.g4 {
    width: 7px;
    height: 4px;
    left: 27px;
    bottom: 108px;
    transform: rotate(-19deg);
}

.g5 {
    width: 5px;
    height: 8px;
    left: 14px;
    bottom: 82px;
    transform: rotate(32deg);
}

.g6 {
    width: 7px;
    height: 4px;
    left: 52px;
    bottom: 54px;
    transform: rotate(42deg);
}



/* ==========================================================
   TEXT
========================================================== */

.content {

    position: relative;

    z-index: 20;

    text-align: center;

}


.intro {

    margin-bottom: 27px;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 2.4px;

    text-transform: uppercase;

}



/* handwritten title */

.birthday-title {

    margin-bottom: 33px;

    font-family:
        "Mrs Saint Delafield",
        cursive;

    font-size: 59px;

    font-weight: 400;

    line-height: .95;

    transform: rotate(-1deg);

}



/* ==========================================================
   DATE
========================================================== */

.date-row {

    width: 100%;

    max-width: 420px;

    margin:

        0 auto
        31px;

    display: grid;

    grid-template-columns:

        1fr
        86px
        1fr;

    gap: 15px;

    align-items: center;

}


.date-side {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;

}


.date-line {

    width: 100%;

    height: 1.4px;

    background: #111;

}


.date-small {

    font-size: 12px;

    line-height: 1;

    font-weight: 700;

    letter-spacing: 1.2px;

    text-transform: uppercase;

}


.day {

    font-family: "Bodoni Moda", serif;

    font-weight: 900;

    font-size: 68px;

    line-height: .68;

    margin-bottom: 13px;

}


.month {

    font-size: 12px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1.1px;

}



/* ==========================================================
   LOCATION
========================================================== */

.venue {

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 1.7px;

    text-transform: uppercase;

}


.address {

    font-size: 13px;

    font-weight: 400;

    line-height: 1.55;

    letter-spacing: 1.25px;

    text-transform: uppercase;

}



/* ==========================================================
   RSVP
========================================================== */

.rsvp {

    margin-top: 34px;

    font-size: 11px;

    font-weight: 400;

    line-height: 1.6;

    letter-spacing: 1.25px;

    text-transform: uppercase;

}



/* ==========================================================
   TABLETS
========================================================== */

@media (max-width: 760px) {

    .scene {

        padding:
            45px
            15px
            60px;

    }


    .card {

        width: min(
            545px,
            89vw
        );

    }


    .envelope {

        width: min(
            620px,
            92vw
        );

    }


    .plant-left {

        left: -70px;

    }


    .plant-right {

        right: -80px;

    }

}



/* ==========================================================
   PHONES
========================================================== */

@media (max-width: 520px) {


    .scene {

        min-height: 100vh;

        padding:
            30px
            12px
            45px;

    }


    .card {

        width: 91vw;

    }


    .envelope {

        width: 95vw;

        height: 88%;

        transform:
            translate(-46%, -48%)
            rotate(-3.5deg);

    }


    .photo {

        height: 72vw;

        min-height: 360px;

        max-height: 445px;

    }


    .age {

        top: -5px;

        font-size: min(
            78vw,
            350px
        );

        letter-spacing: -10vw;

        padding-right: 10vw;

    }


    .paper {

        margin-top: -61px;

        padding:

            111px
            27px
            43px;

    }


    .torn-edge {

        top: -72px;

    }


    .intro {

        font-size: 10px;

        letter-spacing: 1.8px;

    }


    .birthday-title {

        font-size: clamp(
            43px,
            12vw,
            56px
        );

        margin-bottom: 29px;

    }


    .date-row {

        grid-template-columns:

            1fr
            67px
            1fr;

        gap: 10px;

    }


    .date-small {

        font-size: 9px;

    }


    .day {

        font-size: 54px;

    }


    .month {

        font-size: 9px;

    }


    .venue {

        font-size: 11px;

    }


    .address {

        font-size: 10px;

    }


    .rsvp {

        font-size: 8px;

    }


    .plant-left {

        left: -110px;

    }


    .plant-right {

        right: -120px;

    }

}

</style>

</head>


<body>


<div class="scene">



<!-- =========================================================
     KRAFT ENVELOPE
========================================================= -->

<div class="envelope"></div>



<!-- =========================================================
     LEFT PLANT
========================================================= -->

<div class="plant plant-left">

    <span class="leaf l1"></span>
    <span class="leaf l2"></span>
    <span class="leaf l3"></span>
    <span class="leaf l4"></span>
    <span class="leaf l5"></span>
    <span class="leaf l6"></span>
    <span class="leaf l7"></span>

    <span class="flower fl1"></span>
    <span class="flower fl2"></span>
    <span class="flower fl3"></span>

</div>



<!-- =========================================================
     RIGHT PLANT
========================================================= -->

<div class="plant plant-right">

    <span class="leaf l1"></span>
    <span class="leaf l2"></span>
    <span class="leaf l3"></span>
    <span class="leaf l4"></span>
    <span class="leaf l5"></span>
    <span class="leaf l6"></span>
    <span class="leaf l7"></span>

    <span class="flower fl1"></span>
    <span class="flower fl2"></span>
    <span class="flower fl3"></span>

</div>



<!-- =========================================================
     INVITATION
========================================================= -->

<main class="card">



<!-- =========================================================
     PHOTO

     THIS IS WHERE YOU PUT YOUR PHOTO
========================================================= -->

<section class="photo">


    <img
        src="YOUR-PHOTO.jpg"
        alt="Birthday photo"
    >


    <!-- HUGE TRANSPARENT 33 -->

    <div class="age">
        33
    </div>


</section>



<!-- =========================================================
     WHITE PAPER
========================================================= -->

<section class="paper">



<!-- =========================================================
     REAL DISTORTED TORN EDGE
========================================================= -->

<svg
    class="torn-edge"
    viewBox="0 0 1000 150"
    preserveAspectRatio="none"
>


    <defs>


        <!-- random natural paper distortion -->

        <filter
            id="paperTear"
            x="-10%"
            y="-30%"
            width="120%"
            height="180%"
        >


            <feTurbulence
                type="fractalNoise"
                baseFrequency=".015 .09"
                numOctaves="4"
                seed="19"
                result="noise"
            />


            <feDisplacementMap
                in="SourceGraphic"
                in2="noise"
                scale="24"
                xChannelSelector="R"
                yChannelSelector="G"
            />


        </filter>


    </defs>



    <!--
        The rectangle is deliberately pushed down.
        SVG distortion destroys the perfectly smooth edge.
    -->

    <rect

        x="-20"
        y="46"

        width="1040"
        height="130"

        filter="url(#paperTear)"

    />


</svg>



<!-- fuzzy paper fibers -->

<div class="paper-hairs"></div>



<!-- =========================================================
     GOLD FLECKS
========================================================= -->

<span class="gold g1"></span>
<span class="gold g2"></span>
<span class="gold g3"></span>

<span class="gold g4"></span>
<span class="gold g5"></span>
<span class="gold g6"></span>



<!-- =========================================================
     TEXT
========================================================= -->

<div class="content">


    <div class="intro">

        PLEASE JOIN US TO CELEBRATE

    </div>



    <div class="birthday-title">

        Michael's 33rd birthday

    </div>



    <!-- =====================================================
         DATE
    ====================================================== -->

    <div class="date-row">



        <!-- LEFT -->

        <div class="date-side">


            <div class="date-line"></div>


            <div class="date-small">

                SATURDAY

            </div>


            <div class="date-line"></div>


        </div>



        <!-- CENTER -->

        <div>


            <div class="day">

                21

            </div>


            <div class="month">

                SEPTEMBER

            </div>


        </div>



        <!-- RIGHT -->

        <div class="date-side">


            <div class="date-line"></div>


            <div class="date-small">

                8:30 PM

            </div>


            <div class="date-line"></div>


        </div>



    </div>



    <!-- =====================================================
         VENUE
    ====================================================== -->

    <div class="venue">

        AT THE BIRTHDAY HALL

    </div>



    <div class="address">

        BIRTHDAY LANE 123,<br>

        BALLOON TOWN 12345

    </div>



    <!-- =====================================================
         RSVP
    ====================================================== -->

    <div class="rsvp">

        PLEASE RSVP BY THE 10TH OF AUGUST
        @ 123-345-5678

    </div>


</div>


</section>


</main>


</div>


</body>

</html>
