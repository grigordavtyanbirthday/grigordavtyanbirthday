<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Birthday Invitation</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700;6..96,900&family=Montserrat:wght@300;400;500;600;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    min-height: 100%;
}

body {
    font-family: 'Montserrat', sans-serif;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.95),
            rgba(236,233,227,.9) 45%,
            rgba(220,216,208,.85) 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 50px 20px;

    color: #111;
}


/* =========================================================
   CARD
========================================================= */

.invitation {

    position: relative;

    width: 100%;
    max-width: 620px;

    min-height: 930px;

    background: #f7f6f2;

    overflow: hidden;

    box-shadow:
        0 30px 70px rgba(35,25,15,.23),
        0 5px 15px rgba(35,25,15,.10);
}


/* =========================================================
   TOP PHOTO
========================================================= */

.photo-section {

    position: relative;

    height: 505px;

    overflow: hidden;

    background: #ccc;
}


.photo-section img {

    position: absolute;

    width: 100%;
    height: 100%;

    inset: 0;

    object-fit: cover;

    object-position: center 28%;

    filter:
        grayscale(100%)
        contrast(1.06)
        brightness(.93);

}


/* Grey photographic overlay */

.photo-section::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            rgba(205,205,205,.12),
            rgba(90,90,90,.10)
        );

    pointer-events: none;

}


/* =========================================================
   HUGE 33
========================================================= */

.big-age {

    position: absolute;

    z-index: 3;

    top: -55px;
    left: 50%;

    transform: translateX(-50%);

    width: 100%;

    text-align: center;

    font-family: 'Bodoni Moda', serif;

    font-size: clamp(280px, 52vw, 410px);

    line-height: 1;

    font-weight: 400;

    letter-spacing: -45px;

    padding-right: 45px;

    color: rgba(235,235,235,.42);

    user-select: none;

    pointer-events: none;
}


/* =========================================================
   WHITE PAPER SECTION
========================================================= */

.paper-section {

    position: relative;

    z-index: 10;

    margin-top: -64px;

    min-height: 500px;

    padding:
        120px
        62px
        55px;

    background:
        radial-gradient(
            circle at 30% 40%,
            rgba(255,255,255,.95),
            transparent 45%
        ),
        linear-gradient(
            100deg,
            #fbfaf7,
            #f4f3ef 50%,
            #fbfaf7
        );

}


/* =========================================================
   REALISTIC TORN EDGE
========================================================= */

.paper-section {

    clip-path: polygon(

        0% 9%,

        1.5% 7.6%,
        3% 8.3%,
        4.5% 7.2%,
        6% 7.8%,
        7.5% 6.6%,

        9% 7.5%,
        10.5% 6.8%,
        12% 7.4%,
        13.5% 6.1%,
        15% 6.8%,

        16.5% 5.9%,
        18% 6.7%,
        19.5% 5.3%,
        21% 6.1%,
        22.5% 5.2%,

        24% 6.1%,
        25.5% 5%,
        27% 5.8%,
        28.5% 4.9%,
        30% 5.5%,

        31.5% 4.3%,
        33% 5.2%,
        34.5% 4.4%,
        36% 5.1%,
        37.5% 4.2%,

        39% 5.1%,
        40.5% 4%,
        42% 4.9%,
        43.5% 4.2%,
        45% 5%,

        46.5% 4%,
        48% 4.9%,
        49.5% 3.9%,
        51% 4.8%,
        52.5% 3.8%,

        54% 4.8%,
        55.5% 4%,
        57% 5%,
        58.5% 4.1%,
        60% 5.2%,

        61.5% 4.2%,
        63% 5.3%,
        64.5% 4.5%,
        66% 5.5%,
        67.5% 4.7%,

        69% 5.8%,
        70.5% 4.9%,
        72% 6%,
        73.5% 5.1%,
        75% 6.3%,

        76.5% 5.2%,
        78% 6.5%,
        79.5% 5.8%,
        81% 6.9%,
        82.5% 6%,

        84% 7.2%,
        85.5% 6.4%,
        87% 7.4%,
        88.5% 6.7%,
        90% 7.7%,

        91.5% 7%,
        93% 8%,
        94.5% 7.1%,
        96% 8.2%,
        97.5% 7.5%,
        100% 8.8%,

        100% 100%,
        0% 100%

    );
}


/* paper fibres / texture */

.paper-section::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: .30;

    background-image:

        repeating-linear-gradient(
            0deg,
            rgba(75,65,55,.025) 0px,
            rgba(75,65,55,.025) 1px,
            transparent 1px,
            transparent 4px
        ),

        repeating-linear-gradient(
            92deg,
            rgba(75,65,55,.015) 0px,
            rgba(75,65,55,.015) 1px,
            transparent 1px,
            transparent 5px
        );

}


/* subtle shadow under torn edge */

.torn-shadow {

    position: absolute;

    z-index: 8;

    left: 0;

    top: 438px;

    width: 100%;
    height: 65px;

    filter: blur(13px);

    background: rgba(0,0,0,.18);

    clip-path: polygon(
        0 60%,
        8% 47%,
        17% 59%,
        27% 43%,
        39% 56%,
        50% 39%,
        62% 54%,
        74% 41%,
        85% 57%,
        100% 45%,
        100% 100%,
        0 100%
    );

}


/* =========================================================
   MAIN CONTENT
========================================================= */

.content {

    position: relative;

    z-index: 5;

    text-align: center;
}


/* top line */

.intro {

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 2.7px;

    text-transform: uppercase;

    margin-bottom: 32px;
}


/* handwritten birthday line */

.birthday-name {

    font-family: 'Mrs Saint Delafield', cursive;

    font-size: 63px;

    line-height: 1;

    font-weight: 400;

    margin-bottom: 35px;

    transform: rotate(-1deg);
}


/* =========================================================
   DATE ROW
========================================================= */

.date-row {

    display: grid;

    grid-template-columns:
        1fr
        100px
        1fr;

    align-items: center;

    gap: 18px;

    max-width: 480px;

    margin: 0 auto 30px;
}


/* left/right date area */

.date-side {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 8px;
}


.date-line {

    width: 100%;
    height: 1.5px;

    background: #111;
}


.date-small {

    font-size: 14px;

    line-height: 1;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1.5px;
}


/* big day number */

.day-number {

    font-family: 'Bodoni Moda', serif;

    font-size: 73px;

    font-weight: 900;

    line-height: .72;
}


.month {

    margin-top: 10px;

    font-size: 14px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1.5px;
}


/* =========================================================
   LOCATION
========================================================= */

.location-title {

    font-size: 15px;

    font-weight: 700;

    letter-spacing: 2px;

    text-transform: uppercase;

    margin-bottom: 10px;
}


.address {

    font-size: 14px;

    line-height: 1.55;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    font-weight: 400;
}


/* =========================================================
   RSVP
========================================================= */

.rsvp {

    margin-top: 38px;

    font-size: 12px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    line-height: 1.6;
}


/* =========================================================
   GOLD FLECKS
========================================================= */

.gold {

    position: absolute;

    z-index: 4;

    width: 8px;
    height: 4px;

    background: linear-gradient(
        120deg,
        #a77811,
        #e2bd51,
        #9a6905
    );

    clip-path: polygon(
        0 30%,
        65% 0,
        100% 65%,
        35% 100%
    );

    transform: rotate(25deg);
}


.g1 {
    top: 88px;
    right: 28px;
}

.g2 {
    top: 111px;
    right: 55px;

    width: 5px;
    height: 8px;

    transform: rotate(65deg);
}

.g3 {
    top: 139px;
    right: 18px;

    width: 6px;
    height: 3px;
}

.g4 {
    bottom: 73px;
    left: 28px;

    width: 7px;
    height: 4px;
}

.g5 {
    bottom: 97px;
    left: 14px;

    width: 4px;
    height: 8px;
}

.g6 {
    bottom: 43px;
    left: 53px;

    width: 6px;
    height: 4px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {

    body {
        padding: 0;
        background: #f7f6f2;
    }

    .invitation {
        max-width: none;
        width: 100%;
        min-height: 100vh;
        box-shadow: none;
    }

    .photo-section {
        height: 54vh;
        min-height: 390px;
        max-height: 520px;
    }

    .big-age {
        top: -22px;
        font-size: min(77vw, 350px);
        letter-spacing: -9vw;
        padding-right: 9vw;
    }

    .paper-section {
        margin-top: -60px;

        padding:
            110px
            35px
            55px;
    }

    .birthday-name {
        font-size: clamp(48px, 14vw, 64px);
    }

    .date-row {
        grid-template-columns:
            1fr
            80px
            1fr;

        gap: 13px;
    }

    .day-number {
        font-size: 62px;
    }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width: 380px) {

    .paper-section {
        padding-left: 22px;
        padding-right: 22px;
    }

    .intro {
        font-size: 11px;
        letter-spacing: 2px;
    }

    .birthday-name {
        font-size: 48px;
    }

    .date-small {
        font-size: 11px;
    }

    .location-title {
        font-size: 13px;
    }

    .address {
        font-size: 12px;
    }

    .rsvp {
        font-size: 10px;
    }

}

</style>
</head>


<body>


<div class="invitation">


    <!-- ==========================================
         PHOTO
         CHANGE ONLY src=""
    =========================================== -->

    <div class="photo-section">

        <img
            src="YOUR-PHOTO.jpg"
            alt="Birthday photo"
        >

        <!-- LARGE TRANSPARENT AGE -->

        <div class="big-age">
            33
        </div>

    </div>


    <!-- SHADOW BELOW THE TORN PAPER -->

    <div class="torn-shadow"></div>



    <!-- ==========================================
         WHITE TORN PAPER
    =========================================== -->

    <section class="paper-section">


        <!-- decorative gold pieces -->

        <span class="gold g1"></span>
        <span class="gold g2"></span>
        <span class="gold g3"></span>

        <span class="gold g4"></span>
        <span class="gold g5"></span>
        <span class="gold g6"></span>



        <div class="content">


            <!-- CHANGE TEXT -->

            <div class="intro">
                PLEASE JOIN US TO CELEBRATE
            </div>


            <!-- CHANGE NAME / AGE -->

            <div class="birthday-name">
                Michael's 33rd birthday
            </div>



            <!-- DATE -->

            <div class="date-row">


                <!-- LEFT -->

                <div class="date-side">

                    <div class="date-line"></div>

                    <div class="date-small">
                        SATURDAY
                    </div>

                    <div class="date-line"></div>

                </div>



                <!-- CENTER -->

                <div>

                    <div class="day-number">
                        21
                    </div>

                    <div class="month">
                        SEPTEMBER
                    </div>

                </div>



                <!-- RIGHT -->

                <div class="date-side">

                    <div class="date-line"></div>

                    <div class="date-small">
                        8:30 PM
                    </div>

                    <div class="date-line"></div>

                </div>


            </div>



            <!-- LOCATION -->

            <div class="location-title">
                AT THE BIRTHDAY HALL
            </div>


            <div class="address">

                BIRTHDAY LANE 123,<br>

                BALLOON TOWN 12345

            </div>



            <!-- RSVP -->

            <div class="rsvp">

                PLEASE RSVP BY THE 10TH OF AUGUST
                @ 123-345-5678

            </div>


        </div>

    </section>


</div>


</body>
</html>
