<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: "Montserrat", Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #ffffff 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #ffffff 0%, transparent 35%),
        #eeeae2;
    color: #151515;
}

/* =========================
   BACKGROUND / ENVELOPE
========================= */

.scene {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 70px 20px;
    position: relative;
    overflow: hidden;
}

.scene::before {
    content: "";
    position: absolute;

    width: min(780px, 78vw);
    height: min(560px, 55vw);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.18),
            transparent 40%
        ),
        #b78d60;

    transform: rotate(-5deg);

    box-shadow:
        0 20px 45px rgba(0,0,0,.15);
}

/* =========================
   INVITATION
========================= */

.invitation {
    width: min(820px, 100%);
    position: relative;
    z-index: 2;

    background: #f5f2eb;

    box-shadow:
        0 18px 45px rgba(0,0,0,.18);

    overflow: hidden;
}

/* =========================
   PHOTO
========================= */

.photo-section {
    height: 590px;
    position: relative;
    overflow: hidden;
    background: #bfc0bd;
}

.photo {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    filter:
        grayscale(100%)
        contrast(.92);
}

/* BIG TRANSPARENT NUMBER */

.big-number {
    position: absolute;

    top: -65px;
    left: 50%;

    transform: translateX(-50%);

    font-family: Georgia, serif;

    font-size: clamp(
        260px,
        43vw,
        430px
    );

    line-height: .9;

    letter-spacing: -30px;

    color: rgba(255,255,255,.43);

    pointer-events: none;

    white-space: nowrap;
}

/* =========================
   TORN PAPER
========================= */

.paper {
    position: relative;

    margin-top: -75px;

    min-height: 570px;

    padding:
        115px
        70px
        60px;

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(120,100,70,.035) 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 70% 70%,
            rgba(120,100,70,.035) 0 1px,
            transparent 2px
        ),

        #f5f2eb;

    background-size:
        18px 19px,
        23px 22px,
        auto;

    /*
      Irregular torn edge
    */

    clip-path: polygon(

        0% 8%,
        3% 6.3%,
        7% 8%,
        11% 6.2%,
        15% 8.3%,
        20% 6.1%,
        25% 8.1%,
        30% 6.2%,
        35% 8.3%,
        40% 5.9%,
        45% 8.1%,
        50% 6.1%,
        55% 8.2%,
        60% 6%,
        65% 8.1%,
        70% 6.1%,
        75% 8.3%,
        80% 6%,
        85% 8.2%,
        90% 6%,
        95% 8%,
        100% 6.2%,

        100% 100%,
        0% 100%
    );
}

/* extra torn texture */

.paper::before {
    content: "";

    position: absolute;

    top: 15px;
    left: 0;

    width: 100%;
    height: 80px;

    background:

        radial-gradient(
            ellipse at 7% 45%,
            rgba(255,255,255,.75) 0 16px,
            transparent 17px
        ),

        radial-gradient(
            ellipse at 20% 25%,
            rgba(255,255,255,.75) 0 20px,
            transparent 21px
        ),

        radial-gradient(
            ellipse at 34% 55%,
            rgba(255,255,255,.75) 0 17px,
            transparent 18px
        ),

        radial-gradient(
            ellipse at 49% 30%,
            rgba(255,255,255,.75) 0 22px,
            transparent 23px
        ),

        radial-gradient(
            ellipse at 64% 52%,
            rgba(255,255,255,.75) 0 18px,
            transparent 19px
        ),

        radial-gradient(
            ellipse at 80% 28%,
            rgba(255,255,255,.75) 0 21px,
            transparent 22px
        ),

        radial-gradient(
            ellipse at 94% 48%,
            rgba(255,255,255,.75) 0 16px,
            transparent 17px
        );

    pointer-events: none;
}

/* =========================
   GOLD CONFETTI
========================= */

.gold {
    position: absolute;

    width: 5px;
    height: 12px;

    background: #b79a42;

    transform: rotate(30deg);

    opacity: .75;
}

.gold.one {
    left: 7%;
    top: 45%;
}

.gold.two {
    left: 11%;
    top: 65%;
    transform: rotate(-25deg);
}

.gold.three {
    right: 8%;
    top: 25%;
    transform: rotate(35deg);
}

.gold.four {
    right: 12%;
    top: 31%;
    transform: rotate(-15deg);
}

.gold.five {
    right: 9%;
    bottom: 17%;
    transform: rotate(40deg);
}

.gold.six {
    left: 14%;
    bottom: 12%;
    transform: rotate(-35deg);
}

/* =========================
   TEXT
========================= */

.eyebrow {
    text-align: center;

    margin: 0 0 28px;

    font-size: 18px;

    font-weight: 700;

    letter-spacing: 2px;
}

h1 {
    text-align: center;

    margin: 0 0 38px;

    font-family:
        "Parisienne",
        "Brush Script MT",
        cursive;

    font-size: clamp(
        42px,
        6vw,
        66px
    );

    font-weight: 400;

    line-height: 1;
}

/* =========================
   DATE
========================= */

.date {
    max-width: 580px;

    margin: 0 auto 35px;

    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    gap: 18px;
}

.date-side {
    text-align: center;

    font-size: 15px;

    font-weight: 700;

    letter-spacing: 1.6px;
}

.date-line {
    height: 1.5px;

    background: #222;

    margin-top: 10px;
}

.date-center {
    text-align: center;
}

.date-center strong {
    display: block;

    font-family: Georgia, serif;

    font-size: 74px;

    line-height: .75;
}

.date-center span {
    display: block;

    margin-top: 17px;

    font-size: 16px;

    font-weight: 700;

    letter-spacing: 2px;
}

/* =========================
   VENUE
========================= */

.venue {
    text-align: center;

    margin-top: 30px;
}

.venue strong {
    font-size: 18px;

    letter-spacing: 1.5px;
}

.venue p {
    margin-top: 14px;

    font-size: 17px;

    line-height: 1.5;

    letter-spacing: 1px;
}

/* =========================
   RSVP
========================= */

.rsvp {
    text-align: center;

    margin-top: 52px;

    font-size: 14px;

    letter-spacing: 1.2px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .scene {
        padding: 25px 12px;
    }

    .scene::before {
        width: 90vw;
        height: 65vw;
    }

    .photo-section {
        height: 70vw;
        min-height: 280px;
    }

    .paper {
        margin-top: -55px;

        padding:
            90px
            24px
            40px;

        min-height: 500px;
    }

    .eyebrow {
        font-size: 10px;

        letter-spacing: 1.2px;

        margin-bottom: 23px;
    }

    h1 {
        font-size: 38px;

        margin-bottom: 30px;
    }

    .date {
        gap: 10px;
    }

    .date-side {
        font-size: 9px;

        letter-spacing: .8px;
    }

    .date-center strong {
        font-size: 55px;
    }

    .date-center span {
        font-size: 10px;

        letter-spacing: 1px;

        margin-top: 13px;
    }

    .venue strong {
        font-size: 11px;

        letter-spacing: 1px;
    }

    .venue p {
        font-size: 10px;

        letter-spacing: .6px;
    }

    .rsvp {
        margin-top: 35px;

        font-size: 8px;

        letter-spacing: .6px;
    }

    .big-number {
        font-size: 250px;
    }
}

@media (max-width: 390px) {

    .paper {
        padding-left: 18px;
        padding-right: 18px;
    }

    h1 {
        font-size: 32px;
    }

    .date-center strong {
        font-size: 48px;
    }
}

</style>
</head>

<body>

<div class="scene">

    <div class="invitation">

        <!-- PHOTO SECTION -->

        <div class="photo-section">

            <!--
              CHANGE YOUR PHOTO HERE

              Put your photo in the same GitHub folder
              and change the filename below.

              Example:
              src="my-photo.jpg"
            -->

            <img
                class="photo"
                src="photo.jpg"
                alt="Birthday photo"
            >

            <!-- CHANGE 60 TO YOUR AGE -->

            <div class="big-number">
                60
            </div>

        </div>


        <!-- TORN PAPER -->

        <div class="paper">

            <!-- gold details -->

            <span class="gold one"></span>
            <span class="gold two"></span>
            <span class="gold three"></span>
            <span class="gold four"></span>
            <span class="gold five"></span>
            <span class="gold six"></span>


            <!-- MAIN TEXT -->

            <p class="eyebrow">
                PLEASE JOIN US TO CELEBRATE
            </p>


            <!-- CHANGE NAME + AGE -->

            <h1>
                michael's 60th birthday
            </h1>


            <!-- DATE -->

            <div class="date">

                <div class="date-side">

                    SATURDAY

                    <div class="date-line"></div>

                </div>


                <div class="date-center">

                    <!-- CHANGE DAY -->

                    <strong>
                        21
                    </strong>

                    <!-- CHANGE MONTH -->

                    <span>
                        SEPTEMBER
                    </span>

                </div>


                <div class="date-side">

                    8:30 PM

                    <div class="date-line"></div>

                </div>

            </div>


            <!-- LOCATION -->

            <div class="venue">

                <strong>
                    AT THE BIRTHDAY HALL
                </strong>

                <p>
                    BIRTHDAY LANE 123,<br>
                    BALLOON TOWN 12345
                </p>

            </div>


            <!-- RSVP -->

            <p class="rsvp">

                PLEASE RSVP BY THE
                10<sup>TH</sup>
                OF AUGUST
                @ 123-345-5678

            </p>

        </div>

    </div>

</div>

</body>
</html>
