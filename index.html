<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#c9baa8;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
    font-family:'Montserrat',sans-serif;
}


/* MAIN INVITATION */

.invitation{
    position:relative;
    width:min(430px,100%);
    min-height:760px;

    background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.35), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(177,150,124,.15), transparent 35%),
        #eee4d8;

    overflow:hidden;

    box-shadow:
        0 25px 55px rgba(62,44,30,.25),
        0 3px 10px rgba(62,44,30,.15);
}


/* subtle paper texture */

.invitation::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(70,50,35,.035) 0,
            rgba(70,50,35,.035) 1px,
            transparent 1px,
            transparent 4px
        );

    opacity:.6;
    z-index:20;
}


/* PHOTO AREA */

.photo-wrap{
    position:relative;
    height:470px;
    overflow:hidden;
}

.photo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
}


/* SOFT DARK PHOTO GRADIENT */

.photo-wrap::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(33,23,17,.08) 0%,
            rgba(33,23,17,0) 50%,
            rgba(33,23,17,.20) 100%
        );
}


/* REALISTIC TORN PAPER */

.torn-paper{
    position:relative;
    min-height:330px;

    margin-top:-58px;

    padding:
        100px
        35px
        55px;

    background:#eee4d8;

    z-index:5;

    clip-path:polygon(
        0% 18%,
        3% 15%,
        6% 18%,
        9% 13%,
        13% 17%,
        16% 12%,
        20% 16%,
        24% 11%,
        28% 15%,
        32% 10%,
        36% 14%,
        40% 9%,
        44% 14%,
        48% 10%,
        52% 15%,
        56% 11%,
        60% 16%,
        64% 12%,
        68% 17%,
        72% 13%,
        76% 18%,
        80% 12%,
        84% 17%,
        88% 13%,
        92% 18%,
        96% 14%,
        100% 18%,
        100% 100%,
        0% 100%
    );
}


/* ripped shadow / depth */

.torn-paper::before{
    content:"";
    position:absolute;
    top:46px;
    left:0;
    width:100%;
    height:35px;

    background:rgba(49,34,24,.12);

    filter:blur(9px);

    clip-path:polygon(
        0 60%,
        5% 35%,
        10% 65%,
        15% 30%,
        20% 60%,
        25% 25%,
        30% 60%,
        35% 20%,
        40% 55%,
        45% 22%,
        50% 62%,
        55% 26%,
        60% 60%,
        65% 30%,
        70% 65%,
        75% 27%,
        80% 60%,
        85% 30%,
        90% 65%,
        95% 32%,
        100% 60%
    );

    z-index:-1;
}


/* distressed torn fibres */

.torn-paper::after{
    content:"";
    position:absolute;
    top:47px;
    left:0;
    width:100%;
    height:45px;

    opacity:.32;

    background:
        repeating-linear-gradient(
            98deg,
            transparent 0px,
            transparent 5px,
            rgba(102,80,61,.15) 6px,
            transparent 8px
        );

    clip-path:polygon(
        0 45%,
        4% 22%,
        8% 51%,
        12% 18%,
        16% 50%,
        20% 13%,
        24% 47%,
        28% 20%,
        32% 52%,
        36% 15%,
        40% 50%,
        44% 13%,
        48% 50%,
        52% 18%,
        56% 52%,
        60% 15%,
        64% 50%,
        68% 20%,
        72% 55%,
        76% 16%,
        80% 48%,
        84% 20%,
        88% 52%,
        92% 20%,
        96% 48%,
        100% 25%,
        100% 100%,
        0 100%
    );
}


/* CONTENT */

.content{
    position:relative;
    text-align:center;
    color:#51443a;
    z-index:10;
}

.small-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:4px;
    margin-bottom:16px;
}

.age{
    font-family:'Cormorant Garamond',serif;
    font-size:95px;
    line-height:.75;
    font-weight:500;
    color:#473a30;
}

.birthday{
    margin-top:12px;

    font-family:'Cormorant Garamond',serif;
    font-size:34px;
    font-style:italic;
    font-weight:400;
}

.line{
    width:45px;
    height:1px;
    background:#796a5d;

    margin:24px auto;
}

.date{
    font-family:'Cormorant Garamond',serif;
    font-size:21px;
    letter-spacing:2px;
}

.location{
    margin-top:10px;

    font-size:11px;
    line-height:1.8;
    letter-spacing:2px;
    text-transform:uppercase;

    color:#74665b;
}

.footer{
    margin-top:30px;

    font-family:'Cormorant Garamond',serif;
    font-size:17px;
    font-style:italic;

    color:#67584d;
}


/* DECORATIVE TEXT ON PHOTO */

.photo-text{
    position:absolute;
    top:35px;
    left:0;
    width:100%;
    text-align:center;
    color:white;
    z-index:3;

    text-shadow:0 2px 12px rgba(0,0,0,.25);
}

.photo-text span{
    display:block;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:5px;
}

.photo-text h1{
    margin-top:7px;

    font-family:'Cormorant Garamond',serif;
    font-weight:400;
    font-style:italic;
    font-size:37px;
}


/* MOBILE */

@media(max-width:480px){

    body{
        padding:0;
        background:#eee4d8;
    }

    .invitation{
        width:100%;
        min-height:100vh;
        box-shadow:none;
    }

    .photo-wrap{
        height:57vh;
        min-height:430px;
        max-height:570px;
    }

    .torn-paper{
        margin-top:-60px;
        min-height:43vh;
        padding:
            105px
            24px
            55px;
    }

    .age{
        font-size:88px;
    }

    .birthday{
        font-size:31px;
    }

}


/* SMALL PHONES */

@media(max-width:360px){

    .photo-wrap{
        height:440px;
    }

    .age{
        font-size:78px;
    }

    .birthday{
        font-size:28px;
    }

}

</style>
</head>


<body>

<div class="invitation">


    <!-- YOUR PHOTO -->

    <div class="photo-wrap">

        <img
            src="YOUR-PHOTO.jpg"
            alt="Birthday photo"
        >

        <div class="photo-text">

            <span>You're invited</span>

            <h1>
                Celebrate with me
            </h1>

        </div>

    </div>



    <!-- TORN PAPER -->

    <section class="torn-paper">

        <div class="content">

            <div class="small-title">
                Birthday Celebration
            </div>


            <div class="age">
                33
            </div>


            <div class="birthday">
                Birthday
            </div>


            <div class="line"></div>


            <div class="date">
                15 · 08 · 2026
            </div>


            <div class="location">

                19:00 PM<br>

                Restaurant Name<br>

                Yerevan, Armenia

            </div>


            <div class="footer">
                I would love to celebrate this evening with you.
            </div>

        </div>

    </section>

</div>

</body>
</html>
