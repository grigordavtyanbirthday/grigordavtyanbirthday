<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@300;400;500;600;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:'Montserrat',sans-serif;
    background:#ebe8e2;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 15px;
    color:#111;
}


/* =====================================================
   MAIN INVITATION
===================================================== */

.invitation{
    position:relative;
    width:100%;
    max-width:620px;
    background:#faf9f5;
    overflow:hidden;

    box-shadow:
        0 25px 60px rgba(0,0,0,.18),
        0 5px 14px rgba(0,0,0,.08);
}


/* =====================================================
   PHOTO SECTION
===================================================== */

.photo-section{
    position:relative;
    width:100%;
    height:510px;
    overflow:hidden;
    background:#c9c9c9;
}


.photo-section img{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center 25%;

    display:block;

    filter:
        grayscale(100%)
        contrast(1.04)
        brightness(.93);
}


/* gray photo treatment */

.photo-section::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:2;

    background:
        linear-gradient(
            rgba(210,210,210,.08),
            rgba(80,80,80,.08)
        );

    pointer-events:none;
}


/* =====================================================
   HUGE TRANSPARENT 33
===================================================== */

.big-age{
    position:absolute;

    z-index:3;

    top:-48px;
    left:50%;

    transform:translateX(-50%);

    width:110%;

    text-align:center;

    font-family:'DM Serif Display',serif;

    font-size:390px;
    line-height:1;

    font-weight:400;

    letter-spacing:-42px;

    padding-right:42px;

    color:rgba(245,245,245,.38);

    pointer-events:none;
    user-select:none;
}


/* =====================================================
   SHADOW BEHIND RIPPED PAPER
===================================================== */

.tear-shadow{
    position:absolute;

    z-index:4;

    top:450px;
    left:-3%;

    width:106%;
    height:90px;

    filter:blur(10px);

    opacity:.28;
}


/* =====================================================
   WHITE PAPER SECTION
===================================================== */

.paper-section{
    position:relative;

    z-index:6;

    margin-top:-55px;

    min-height:590px;

    padding:
        112px
        60px
        55px;

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(255,255,255,.9),
            transparent 38%
        ),
        linear-gradient(
            110deg,
            #fbfaf7,
            #f7f6f2 48%,
            #fbfaf7
        );
}


/* subtle paper texture */

.paper-section::before{
    content:"";

    position:absolute;
    inset:0;

    z-index:-2;

    opacity:.50;

    background-image:

        radial-gradient(
            rgba(70,60,45,.04) .55px,
            transparent .7px
        ),

        radial-gradient(
            rgba(255,255,255,.9) .6px,
            transparent .8px
        );

    background-size:
        5px 5px,
        8px 8px;

    background-position:
        0 0,
        3px 3px;
}


/* =====================================================
   REAL RIPPED EDGE
===================================================== */

.tear-svg{
    position:absolute;

    top:-61px;
    left:0;

    width:100%;
    height:90px;

    z-index:4;

    overflow:visible;
}


.tear-svg path{
    fill:#faf9f5;
}


/* ripped fibres */

.paper-fibres{
    position:absolute;

    top:-38px;
    left:0;

    width:100%;
    height:42px;

    z-index:5;

    opacity:.22;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            102deg,
            transparent 0px,
            transparent 5px,
            rgba(70,65,55,.22) 6px,
            transparent 7px,
            transparent 12px
        );
}


/* =====================================================
   GOLD FLECKS
===================================================== */

.gold{
    position:absolute;

    z-index:8;

    background:
        linear-gradient(
            130deg,
            #8f6909,
            #e2bc43,
            #a2760d
        );

    clip-path:polygon(
        0 35%,
        40% 0,
        100% 20%,
        72% 100%,
        14% 76%
    );
}


.gold1{
    width:8px;
    height:4px;
    right:31px;
    top:63px;
    transform:rotate(28deg);
}

.gold2{
    width:6px;
    height:5px;
    right:54px;
    top:86px;
    transform:rotate(-35deg);
}

.gold3{
    width:4px;
    height:7px;
    right:24px;
    top:111px;
    transform:rotate(65deg);
}

.gold4{
    width:7px;
    height:4px;
    left:33px;
    bottom:116px;
    transform:rotate(-25deg);
}

.gold5{
    width:5px;
    height:8px;
    left:16px;
    bottom:84px;
    transform:rotate(32deg);
}

.gold6{
    width:7px;
    height:4px;
    left:59px;
    bottom:54px;
    transform:rotate(42deg);
}


/* =====================================================
   TEXT
===================================================== */

.content{
    position:relative;
    z-index:10;
    text-align:center;
}


/* PLEASE JOIN US */

.intro{
    font-size:14px;
    font-weight:700;

    letter-spacing:2.6px;

    text-transform:uppercase;

    margin-bottom:28px;
}


/* SCRIPT TEXT */

.birthday-title{
    font-family:'Mrs Saint Delafield',cursive;

    font-size:68px;
    font-weight:400;

    line-height:.92;

    margin-bottom:36px;

    transform:rotate(-1deg);
}


/* =====================================================
   DATE ROW
===================================================== */

.date-row{
    width:100%;
    max-width:465px;

    margin:
        0 auto
        32px;

    display:grid;

    grid-template-columns:
        1fr
        100px
        1fr;

    gap:18px;

    align-items:center;
}


.date-side{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    gap:8px;
}


.date-line{
    width:100%;
    height:1.5px;
    background:#111;
}


.date-small{
    font-size:14px;

    font-weight:700;

    letter-spacing:1.4px;

    line-height:1;

    text-transform:uppercase;
}


.day-number{
    font-family:'DM Serif Display',serif;

    font-size:75px;

    line-height:.70;

    font-weight:400;

    margin-bottom:14px;
}


.month{
    font-size:14px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:1.2px;
}


/* =====================================================
   VENUE
===================================================== */

.venue{
    font-size:15px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:1.8px;

    margin-bottom:10px;
}


.address{
    font-size:14px;

    font-weight:400;

    line-height:1.55;

    letter-spacing:1.4px;

    text-transform:uppercase;
}


/* =====================================================
   RSVP
===================================================== */

.rsvp{
    margin-top:37px;

    font-size:12px;

    line-height:1.6;

    letter-spacing:1.4px;

    text-transform:uppercase;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

    body{
        padding:0;
        background:#faf9f5;
    }


    .invitation{
        width:100%;
        max-width:none;

        min-height:100vh;

        box-shadow:none;
    }


    .photo-section{
        height:58vh;
        min-height:420px;
        max-height:540px;
    }


    .big-age{
        top:-5px;

        font-size:min(92vw,385px);

        letter-spacing:-9vw;

        padding-right:9vw;
    }


    .tear-shadow{
        top:calc(58vh - 60px);
    }


    .paper-section{
        margin-top:-55px;

        padding:
            110px
            35px
            50px;
    }


    .birthday-title{
        font-size:clamp(
            49px,
            14vw,
            68px
        );
    }

}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:410px){

    .photo-section{
        height:430px;
        min-height:430px;
    }


    .big-age{
        top:10px;

        font-size:300px;

        letter-spacing:-31px;

        padding-right:31px;
    }


    .tear-shadow{
        top:375px;
    }


    .paper-section{
        padding:
            102px
            24px
            45px;
    }


    .intro{
        font-size:11px;
        letter-spacing:2px;
    }


    .birthday-title{
        font-size:50px;
        white-space:normal;
    }


    .date-row{
        grid-template-columns:
            1fr
            75px
            1fr;

        gap:11px;
    }


    .date-small{
        font-size:11px;
    }


    .day-number{
        font-size:61px;
    }


    .month{
        font-size:11px;
    }


    .venue{
        font-size:13px;
    }


    .address{
        font-size:12px;
    }


    .rsvp{
        font-size:10px;
    }

}

</style>
</head>


<body>

</html>
