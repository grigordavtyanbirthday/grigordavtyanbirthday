<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    font-family: 'Montserrat', sans-serif;
    color: #111;
    overflow-x: hidden;
}


/* =========================================================
   FULL BACKGROUND — TABLETOP
========================================================= */

.scene {
    position: relative;

    min-height: 100vh;
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 70px 25px;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 25% 15%,
            rgba(255,255,255,.95),
            rgba(248,247,244,.92) 45%,
            rgba(239,237,232,.96) 100%
        );
}


/* very subtle tabletop texture */

.scene::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: .26;

    background-image:
        radial-gradient(
            rgba(80,70,60,.05) .5px,
            transparent .8px
        );

    background-size: 7px 7px;
}


/* =========================================================
   KRAFT ENVELOPE
========================================================= */

.envelope {
    position: absolute;

    width: min(730px, 78vw);
    height: 900px;

    left: 50%;
    top: 50%;

    transform:
        translate(-44%, -48%)
        rotate(-5deg);

    background:
        radial-gradient(
            circle at 30% 20%,
            rgba(255,255,255,.08),
            transparent 30%
        ),
        repeating-linear-gradient(
            18deg,
            rgba(80,55,30,.04) 0px,
            rgba(80,55,30,.04) 1px,
            transparent 1px,
            transparent 6px
        ),
        #b88d61;

    box-shadow:
        0 18px 45px rgba(70,50,30,.22);

    z-index: 1;
}


/* envelope flap */

.envelope::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 48%;

    background:
        linear-gradient(
            145deg,
            transparent 0 49.5%,
            rgba(104,73,43,.17) 50% 50.8%,
            transparent 51%
        ),
        linear-gradient(
            215deg,
            transparent 0 49.5%,
            rgba(104,73,43,.13) 50% 50.8%,
            transparent 51%
        );

    pointer-events: none;
}


/* envelope lower fold */

.envelope::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 52%;

    background:
        linear-gradient(
            35deg,
            transparent 0 49.6%,
            rgba(95,65,38,.12) 50% 50.8%,
            transparent 51%
        ),
        linear-gradient(
            -35deg,
            transparent 0 49.6%,
            rgba(95,65,38,.11) 50% 50.8%,
            transparent 51%
        );
}


/* =========================================================
   BOTANICAL DECORATIONS
========================================================= */

.branch {
    position: absolute;

    z-index: 2;

    width: 220px;
    height: 410px;

    pointer-events: none;
}


/* stem */

.branch::before {
    content: "";

    position: absolute;

    width: 3px;
    height: 100%;

    left: 50%;

    border-radius: 50%;

    background: #6f7658;

    transform: rotate(8deg);
}


/* leaves created with background */

.branch .leaf {
    position: absolute;

    width: 28px;
    height: 72px;

    border-radius:
        90% 10% 90% 10%;

    background:
        linear-gradient(
            135deg,
            #556149,
            #8b9274
        );

    transform-origin: bottom center;

    opacity: .9;
}


.branch .leaf:nth-child(1) {
    top: 18px;
    left: 78px;
    transform: rotate(-42deg);
}

.branch .leaf:nth-child(2) {
    top: 68px;
    left: 108px;
    transform: rotate(32deg);
}

.branch .leaf:nth-child(3) {
    top: 116px;
    left: 71px;
    transform: rotate(-47deg);
}

.branch .leaf:nth-child(4) {
    top: 166px;
    left: 113px;
    transform: rotate(38deg);
}

.branch .leaf:nth-child(5) {
    top: 214px;
    left: 73px;
    transform: rotate(-41deg);
}

.branch .leaf:nth-child(6) {
    top: 265px;
    left: 108px;
    transform: rotate(36deg);
}

.branch .leaf:nth-child(7) {
    top: 312px;
    left: 76px;
    transform: rotate(-39deg);
}


/* pinkish flower tips */

.branch .flower {
    position: absolute;

    width: 17px;
    height: 48px;

    border-radius:
        60% 60% 45% 45%;

    background:
        linear-gradient(
            #87626d,
            #b9828f
        );

    opacity: .85;
}


.branch .flower:nth-of-type(8) {
    top: 4px;
    left: 105px;
    transform: rotate(25deg);
}

.branch .flower:nth-of-type(9) {
    top: 85px;
    left: 62px;
    transform: rotate(-30deg);
}

.branch .flower:nth-of-type(10) {
    top: 190px;
    left: 119px;
    transform: rotate(34deg);
}


/* left branch */

.branch-left {
    left: max(-50px, calc(50% - 520px));
    bottom: -70px;

    transform: rotate(-18deg);
}


/* right upper branch */

.branch-right {
    right: max(-70px, calc(50% - 550px));
    top: -90px;

    transform:
        rotate(158deg)
        scale(.83);
}


/* =========================================================
   MAIN CARD
========================================================= */

.card {
    position: relative;

    z-index: 5;

    width: min(610px, 92vw);

    background: #fbfaf6;

    box-shadow:
        0 28px 70px rgba(38,28,20,.25),
        0 5px 18px rgba(38,28,20,.12);

    overflow: hidden;
}


/* =========================================================
   PHOTO
========================================================= */

.photo {
    position: relative;

    width: 100%;
    height: 505px;

    overflow: hidden;

    background: #c8c8c8;
}


.photo img {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    /* change this if needed */
    object-position: center 25%;

    filter:
        grayscale(100%)
        contrast(1.08)
        brightness(.92);

    display: block;
}


/* gray photographic wash */

.photo::after {
    content: "";

    position: absolute;
    inset: 0;

    z-index: 2;

    background:
        linear-gradient(
            to bottom,
            rgba(215,215,215,.10),
            rgba(75,75,75,.06)
        );

    pointer-events: none;
}


/* =========================================================
   HUGE TRANSPARENT 33
========================================================= */

.age {
    position: absolute;

    z-index: 3;

    top: -84px;
    left: 50%;

    transform: translateX(-50%);

    width: 115%;

    text-align: center;

    font-family: 'Libre Bodoni', serif;

    font-size: 415px;

    font-weight: 400;

    line-height: 1;

    letter-spacing: -54px;

    padding-right: 54px;

    color: rgba(242,242,242,.38);

    pointer-events: none;

    user-select: none;
}


/* =========================================================
   PAPER BODY
========================================================= */

.paper {
    position: relative;

    z-index: 8;

    margin-top: -65px;

    min-height: 610px;

    padding:
        128px
        60px
        56px;

    background:
        radial-gradient(
            circle at 20% 25%,
            rgba(255,255,255,.92),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(225,219,205,.12),
            transparent 38%
        ),
        #fbfaf6;
}


/* actual paper grain */

.paper::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: .4;

    background-image:

        repeating-linear-gradient(
            7deg,
            rgba(100,80,60,.022) 0px,
            rgba(100,80,60,.022) 1px,
            transparent 1px,
            transparent 5px
        ),

        repeating-linear-gradient(
            96deg,
            rgba(100,80,60,.017) 0px,
            rgba(100,80,60,.017) 1px,
            transparent 1px,
            transparent 7px
        );
}


/* =========================================================
   TORN PAPER — irregular edge
========================================================= */

.tear {
    position: absolute;

    top: -76px;
    left: -1%;

    width: 102%;
    height: 110px;

    z-index: 8;

    overflow: visible;

    filter:
        drop-shadow(
            0 -4px 3px rgba(0,0,0,.08)
        );
}


.tear path {
    fill: #fbfaf6;
}


/* fuzzy ripped fibres */

.fibres {
    position: absolute;

    top: -55px;
    left: 0;

    width: 100%;
    height: 55px;

    z-index: 9;

    opacity: .27;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            101deg,
            transparent 0px,
            transparent 5px,
            rgba(110,105,95,.24) 6px,
            transparent 7px,
            transparent 13px
        );

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 40%,
            transparent 100%
        );
}


/* extra edge highlights */

.fibre-line {
    position: absolute;

    z-index: 9;

    top: -33px;

    width: 40px;
    height: 1px;

    background: rgba(125,120,108,.35);

    transform-origin: left center;
}


.f1 {
    left: 8%;
    transform: rotate(-76deg);
}

.f2 {
    left: 19%;
    transform: rotate(-82deg);
}

.f3 {
    left: 35%;
    transform: rotate(-78deg);
}

.f4 {
    left: 64%;
    transform: rotate(-82deg);
}

.f5 {
    left: 82%;
    transform: rotate(-76deg);
}


/* =========================================================
   GOLD FLECKS
========================================================= */

.gold {
    position: absolute;

    z-index: 12;

    background:
        linear-gradient(
            130deg,
            #8e6608,
            #e8c85c,
            #b2800e
        );

    clip-path:
        polygon(
            0 27%,
            42% 0,
            100% 28%,
            71% 100%,
            17% 77%
        );
}


.g1 {
    width: 8px;
    height: 4px;
    top: 67px;
    right: 30px;
    transform: rotate(22deg);
}

.g2 {
    width: 6px;
    height: 5px;
    top: 95px;
    right: 51px;
    transform: rotate(-28deg);
}

.g3 {
    width: 4px;
    height: 7px;
    top: 123px;
    right: 18px;
    transform: rotate(58deg);
}

.g4 {
    width: 7px;
    height: 4px;
    left: 28px;
    bottom: 117px;
    transform: rotate(-18deg);
}

.g5 {
    width: 5px;
    height: 8px;
    left: 14px;
    bottom: 86px;
    transform: rotate(31deg);
}

.g6 {
    width: 8px;
    height: 4px;
    left: 52px;
    bottom: 57px;
    transform: rotate(41deg);
}

.g7 {
    width: 5px;
    height: 4px;
    right: 14px;
    top: 158px;
    transform: rotate(-32deg);
}


/* =========================================================
   TEXT
========================================================= */

.content {
    position: relative;

    z-index: 15;

    text-align: center;
}


/* top heading */

.intro {
    margin-bottom: 28px;

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 2.7px;

    text-transform: uppercase;
}


/* handwritten line */

.birthday-title {
    margin-bottom: 38px;

    font-family: 'Mrs Saint Delafield', cursive;

    font-size: 67px;

    font-weight: 400;

    line-height: .95;

    transform: rotate(-1deg);
}


/* =========================================================
   DATE
========================================================= */

.date-row {
    display: grid;

    grid-template-columns:
        1fr
        100px
        1fr;

    gap: 18px;

    align-items: center;

    width: 100%;
    max-width: 455px;

    margin:
        0 auto
        35px;
}


.date-side {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 9px;
}


.date-line {
    width: 100%;
    height: 1.5px;

    background: #111;
}


.date-small {
    font-size: 14px;

    line-height: 1;

    font-weight: 700;

    letter-spacing: 1.35px;

    text-transform: uppercase;
}


.day {
    margin-bottom: 13px;

    font-family: 'Libre Bodoni', serif;

    font-size: 74px;

    font-weight: 700;

    line-height: .70;
}


.month {
    font-size: 13px;

    font-weight: 700;

    letter-spacing: 1.3px;

    text-transform: uppercase;
}


/* =========================================================
   VENUE
========================================================= */

.venue {
    margin-bottom: 10px;

    font-size: 15px;

    font-weight: 700;

    letter-spacing: 2px;

    text-transform: uppercase;
}


.address {
    font-size: 14px;

    font-weight: 400;

    line-height: 1.6;

    letter-spacing: 1.45px;

    text-transform: uppercase;
}


/* =========================================================
   RSVP
========================================================= */

.rsvp {
    margin-top: 38px;

    font-size: 12px;

    line-height: 1.65;

    letter-spacing: 1.35px;

    text-transform: uppercase;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .scene {
        padding:
            45px
            16px
            70px;
    }

    .envelope {
        width: 93vw;
        height: 88%;

        transform:
            translate(-46%, -48%)
            rotate(-4deg);
    }

    .card {
        width: min(92vw, 610px);
    }

    .photo {
        height: 70vw;
        min-height: 390px;
        max-height: 500px;
    }

    .age {
        top: -25px;

        font-size: min(82vw, 390px);

        letter-spacing: -10vw;

        padding-right: 10vw;
    }

    .paper {
        margin-top: -61px;

        padding:
            118px
            37px
            55px;
    }

    .birthday-title {
        font-size: clamp(
            50px,
            13vw,
            66px
        );
    }

    .branch-left {
        left: -95px;
    }

    .branch-right {
        right: -115px;
    }
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 430px) {

    .scene {
        padding:
            25px
            12px
            45px;
    }

    .envelope {
        width: 96vw;
    }

    .card {
        width: 94vw;
    }

    .photo {
        height: 410px;
        min-height: 410px;
    }

    .age {
        top: 3px;

        font-size: 295px;

        letter-spacing: -35px;

        padding-right: 35px;
    }

    .paper {
        padding:
            109px
            25px
            45px;
    }

    .intro {
        font-size: 11px;

        letter-spacing: 1.9px;

        margin-bottom: 24px;
    }

    .birthday-title {
        font-size: 49px;

        line-height: .95;

        margin-bottom: 33px;
    }

    .date-row {
        grid-template-columns:
            1fr
            73px
            1fr;

        gap: 11px;
    }

    .date-small {
        font-size: 10px;

        letter-spacing: 1px;
    }

    .day {
        font-size: 59px;
    }

    .month {
        font-size: 10px;
    }

    .venue {
        font-size: 12px;

        letter-spacing: 1.4px;
    }

    .address {
        font-size: 11px;

        letter-spacing: 1.1px;
    }

    .rsvp {
        font-size: 9px;

        letter-spacing: 1px;
    }
}

</style>
</head>


<body>


<div class="scene">


    <!-- =====================================================
         BACKGROUND ENVELOPE
    ====================================================== -->

    <div class="envelope"></div>



    <!-- =====================================================
         DECORATIVE BRANCH — LEFT
    ====================================================== -->

    <div class="branch branch-left">

        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>

        <span class="flower"></span>
        <span class="flower"></span>
        <span class="flower"></span>

    </div>



    <!-- =====================================================
         DECORATIVE BRANCH — RIGHT
    ====================================================== -->

    <div class="branch branch-right">

        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>

        <span class="flower"></span>
        <span class="flower"></span>
        <span class="flower"></span>

    </div>



    <!-- =====================================================
         INVITATION CARD
    ====================================================== -->

    <main class="card">


        <!-- =================================================
             YOUR PHOTO

             CHANGE ONLY src="YOUR-PHOTO.jpg"
        ================================================== -->

        <section class="photo">


            <img
                src="YOUR-PHOTO.jpg"
                alt="Birthday photo"
            >


            <!-- LARGE TRANSPARENT NUMBER -->

            <div class="age">
                33
            </div>


        </section>



        <!-- =================================================
             TORN WHITE PAPER
        ================================================== -->

        <section class="paper">


            <!-- REAL IRREGULAR TEAR -->

            <svg
                class="tear"
                viewBox="0 0 1000 130"
                preserveAspectRatio="none"
            >

                <path d="

                M0 78

                C13 67 21 72 33 63
                C42 57 49 70 60 62
                C70 54 76 64 88 57
                C98 51 105 61 116 54

                C127 47 135 57 145 50
                C157 42 163 54 175 47
                C186 39 193 52 205 44
                C215 37 223 48 235 41

                C246 35 253 46 265 39
                C276 33 284 43 296 36
                C307 30 315 41 326 34
                C337 28 345 39 357 32

                C369 26 377 37 388 30
                C399 24 407 36 419 29
                C430 23 439 35 451 28
                C462 22 471 34 482 27

                C494 21 503 34 515 27
                C526 21 535 34 547 27
                C559 22 568 35 580 28
                C591 23 600 36 612 30

                C623 25 632 38 644 32
                C655 27 665 40 677 34
                C689 29 698 42 711 37
                C722 32 732 45 744 40

                C756 35 766 48 778 43
                C790 38 800 52 812 47
                C824 42 835 56 847 51
                C859 46 870 60 882 55

                C894 50 905 64 918 59
                C929 54 941 69 953 64
                C966 59 978 73 989 68
                C994 66 997 71 1000 72

                L1000 130
                L0 130

                Z

                " />

            </svg>



            <!-- torn fibres -->

            <div class="fibres"></div>

            <span class="fibre-line f1"></span>
            <span class="fibre-line f2"></span>
            <span class="fibre-line f3"></span>
            <span class="fibre-line f4"></span>
            <span class="fibre-line f5"></span>



            <!-- GOLD FLAKES -->

            <span class="gold g1"></span>
            <span class="gold g2"></span>
            <span class="gold g3"></span>
            <span class="gold g4"></span>
            <span class="gold g5"></span>
            <span class="gold g6"></span>
            <span class="gold g7"></span>



            <!-- =================================================
                 TEXT
            ================================================== -->

            <div class="content">


                <div class="intro">
                    PLEASE JOIN US TO CELEBRATE
                </div>


                <div class="birthday-title">
                    Michael's 33rd birthday
                </div>



                <!-- DATE -->

                <div class="date-row">


                    <!-- LEFT -->

                    <div class="date-side">

                        <div class="date-line"></div>

                        <div class="date-small">
                            SATURDAY
                        </div>

                        <div class="date-line"></div>

                    </div>



                    <!-- CENTER -->

                    <div>

                        <div class="day">
                            21
                        </div>

                        <div class="month">
                            SEPTEMBER
                        </div>

                    </div>



                    <!-- RIGHT -->

                    <div class="date-side">

                        <div class="date-line"></div>

                        <div class="date-small">
                            8:30 PM
                        </div>

                        <div class="date-line"></div>

                    </div>


                </div>



                <!-- LOCATION -->

                <div class="venue">
                    AT THE BIRTHDAY HALL
                </div>


                <div class="address">

                    BIRTHDAY LANE 123,<br>

                    BALLOON TOWN 12345

                </div>



                <!-- RSVP -->

                <div class="rsvp">

                    PLEASE RSVP BY THE 10TH OF AUGUST
                    @ 123-345-5678

                </div>


            </div>


        </section>


    </main>


</div>


</body>
</html>
