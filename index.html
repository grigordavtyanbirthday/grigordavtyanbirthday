<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>70th Birthday Invitation</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #eee9e1;
}

/* Invitation container */

.page {
    position: relative;
    width: 100%;
    max-width: 768px;
    margin: 0 auto;
    line-height: 0;
}

/* Invitation image */

.invitation {
    display: block;
    width: 100%;
    height: auto;
}

/* Music button */

.music-button {
    position: absolute;

    right: 22px;
    bottom: 22px;

    width: 50px;
    height: 50px;

    border: none;
    border-radius: 50%;

    background: rgba(245, 237, 225, 0.92);

    color: #5a4637;

    font-size: 21px;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;

    box-shadow: 0 4px 15px rgba(0,0,0,0.18);

    z-index: 10;
}


/* MOBILE */

@media (max-width: 768px) {

    html,
    body {
        width: 100%;
        height: auto;
        min-height: 0;
        overflow-x: hidden;
        background: #eee9e1;
    }

    .page {
        width: 100%;
        height: auto;
        min-height: 0;
        margin: 0;
        padding: 0;
    }

    .invitation {
        display: block;
        width: 100%;
        height: auto;
        margin: 0;
        padding: 0;
    }

    .music-button {
        width: 46px;
        height: 46px;

        right: 16px;
        bottom: 16px;

        font-size: 19px;
    }
}

</style>
</head>


<body>

<div class="page">

    <img
        class="invitation"
        src="./invitation-70.png"
        alt="70th Birthday Invitation"
    >

    <!-- MUSIC BUTTON -->
    <button
        class="music-button"
        id="musicButton"
        aria-label="Play music"
    >
        ♪
    </button>

</div>


<audio id="bgMusic" loop preload="auto">
    <source src="./music.mp3" type="audio/mpeg">
</audio>


<script>

const music = document.getElementById("bgMusic");
const musicButton = document.getElementById("musicButton");

let musicStarted = false;


/* First tap anywhere starts music */

document.addEventListener("click", function startMusic() {

    if (!musicStarted) {

        music.volume = 0.7;

        music.play().then(() => {

            musicStarted = true;
            musicButton.innerHTML = "❚❚";

        }).catch(() => {});

    }

}, { once: true });


/* Music button */

musicButton.addEventListener("click", function(event) {

    event.stopPropagation();

    if (music.paused) {

        music.play();

        musicStarted = true;

        musicButton.innerHTML = "❚❚";

        musicButton.setAttribute(
            "aria-label",
            "Pause music"
        );

    } else {

        music.pause();

        musicButton.innerHTML = "♪";

        musicButton.setAttribute(
            "aria-label",
            "Play music"
        );

    }

});

</script>

</body>
</html>
